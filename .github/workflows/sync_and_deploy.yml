name: Sync Releases & Deploy to GitHub Pages

on:
  schedule:
    # Run every 6 hours automatically to check for new releases
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow committing updates and deploying to Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests

      - name: Run Release Auto-Detection & Build
        run: |
          python3 generate.py

      - name: Commit & Push Changes (if any updates detected)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if there are any changes in generated static assets or HTML files
          git add index.html apps/ sitemap.xml robots.txt
          if ! git diff-index --quiet HEAD; then
            echo "New releases or updates detected! Committing changes..."
            git commit -m "chore(sync): auto-sync github releases and regenerate pages [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No new updates or releases detected. Workspace clean."
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
