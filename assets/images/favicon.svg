<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03000a" />
      <stop offset="100%" stop-color="#0d0d1e" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="24" fill="url(#bg-grad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- Glowing Neon Outer Ring -->
  <rect x="5" y="5" width="90" height="90" rx="19" fill="none" stroke="url(#neon-grad)" stroke-width="1" stroke-dasharray="10 15" opacity="0.6" filter="url(#glow)"/>

  <!-- AI App Hub Icon Graphic -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Stylized AI Triangle / Nodes -->
    <path d="M 40 15 L 68 62 L 12 62 Z" fill="none" stroke="url(#neon-grad)" stroke-width="3" stroke-linejoin="round"/>

    <!-- Pulse Lines inside triangle -->
    <path d="M 28 50 L 37 32 L 43 45 L 52 28" fill="none" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>

    <!-- Glowing Nodes -->
    <circle cx="40" cy="15" r="4.5" fill="#bd00ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="68" cy="62" r="4.5" fill="#00e5ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="12" cy="62" r="4.5" fill="#00e5ff" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="52" cy="28" r="3" fill="#ffffff"/>
  </g>
</svg>
